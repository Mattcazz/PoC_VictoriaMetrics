services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=30d"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  metrics-importer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrics-importer
    volumes:
      - ./metrics.pb:/data/metrics.pb:ro
    command:
      - "-file=/data/metrics.pb"
      - "-url=http://victoriametrics:8428/opentelemetry/v1/metrics"
    depends_on:
      victoriametrics:
        condition: service_healthy
    restart: "no"

volumes:
  vmdata: